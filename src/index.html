<html>
  <head>
    <title>Shell</title>
    <meta
      name="piral"
      content="https://feed.piral.cloud/api/v1/native-federation/vnf"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Micro frontend:</h1>
    <app-mfe1></app-mfe1>

    <script type="esms-options">
      { "shimMode": true }
    </script>

    <script type="module-shim">
      window.addEventListener(
        "mfe-loader-available",
        (e) => {
          // Load your remote modules, a remote can have multiple modules
          e.detail.loadRemoteModule("@tractor-store/mfe1", "./Component");
        },
        { once: true }
      );
    </script>

    <script src="./simple/orchestrator.js"></script>
  </body>
</html>
