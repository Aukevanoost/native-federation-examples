<!-- AVOID A RACE CONDITION -->
<html>
  <head>
    <title>Shell</title>
    <meta name="piral" content="https://feed.piral.cloud/api/v1/native-federation/vnf" />
  </head>
  <body>
    <mfe-events></mfe-events>

    <!-- Event registry -->
    <script src="https://unpkg.com/vanilla-native-federation@0.19.6/registry.mjs"></script>

    <script type="esms-options">
      { "shimMode": true }
    </script>

    <!-- Register subscription -->
    <script type="module-shim">
      window.__NF_REGISTRY__.onReady('orch.init-ready', ({ loadRemoteModule }) => {
        loadRemoteModule("@tractor-store/events", "./bootstrap");
      });
    </script>

    <!-- Register event -->
    <script src="./orchestrator.js"></script>
  </body>
</html>
